<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financify - Finanzas Personales</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Financify</h2>
            </div>
            <nav>
                <ul id="nav-menu">
                    <li class="active" data-target="dashboard">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        Dashboard
                    </li>
                    <li data-target="ingresos">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        Ingresos
                    </li>
                    <li data-target="pagos">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                        Pagos
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <h1 id="page-title">Dashboard</h1>
            </header>

            <!-- Dashboard View -->
            <section id="dashboard" class="view active-view">
                <div class="summary-cards">
                    <div class="card">
                        <h3>Balance Total</h3>
                        <p id="total-balance" class="amount highlight">$0.00</p>
                    </div>
                    <div class="card">
                        <h3>Ingresos Totales</h3>
                        <p id="total-incomes" class="amount">$0.00</p>
                    </div>
                    <div class="card">
                        <h3>Pagos Totales</h3>
                        <p id="total-payments" class="amount">$0.00</p>
                    </div>
                </div>
                <div class="recent-transactions">
                    <h2>Últimos Movimientos</h2>
                    <ul id="recent-list" class="transaction-list">
                        <!-- Generado por JS -->
                    </ul>
                </div>
            </section>

            <!-- Ingresos View -->
            <section id="ingresos" class="view">
                <div class="form-container card">
                    <h2>Registrar Ingreso</h2>
                    <form id="form-ingreso">
                        <input type="text" id="desc-ingreso" placeholder="Descripción (ej. Salario)" required>
                        <input type="number" id="monto-ingreso" placeholder="Monto" required min="0.01" step="0.01">
                        <button type="submit" class="btn-primary">Añadir Ingreso</button>
                    </form>
                </div>
                <div class="list-container">
                    <h2>Historial de Ingresos</h2>
                    <ul id="ingresos-list" class="transaction-list">
                        <!-- Generado por JS -->
                    </ul>
                </div>
            </section>

            <!-- Pagos View -->
            <section id="pagos" class="view">
                <div class="form-container card">
                    <h2>Registrar Pago</h2>
                    <form id="form-pago">
                        <input type="text" id="desc-pago" placeholder="Descripción (ej. Renta)" required>
                        <input type="number" id="monto-pago" placeholder="Monto" required min="0.01" step="0.01">
                        <button type="submit" class="btn-primary">Añadir Pago</button>
                    </form>
                </div>
                <div class="list-container">
                    <h2>Historial de Pagos</h2>
                    <ul id="pagos-list" class="transaction-list">
                        <!-- Generado por JS -->
                    </ul>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
